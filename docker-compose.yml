services:
  api:
    build:
      context: ./api
    environment:
      APP_ENV: production
      APP_BASE_URL: ${APP_BASE_URL:-http://127.0.0.1:8010}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://127.0.0.1:5173}
      DATA_DIR: /data
      STATE_FILE: ${STATE_FILE:-/data/state.json}
      STORE_PERSISTENCE_ENABLED: ${STORE_PERSISTENCE_ENABLED:-true}
      FRAME_EXTRACT_INTERVAL_SECONDS: ${FRAME_EXTRACT_INTERVAL_SECONDS:-4}
      MAX_FRAME_ANALYSIS_COUNT: ${MAX_FRAME_ANALYSIS_COUNT:-12}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-262144000}
      REQUEST_LOG_ENABLED: ${REQUEST_LOG_ENABLED:-true}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      MAP_PROVIDER: ${MAP_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TEXT_MODEL: ${OPENAI_TEXT_MODEL:-}
      OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL:-}
      AMAP_WEB_KEY: ${AMAP_WEB_KEY:-}
      AMAP_WEB_SERVICE_KEY: ${AMAP_WEB_SERVICE_KEY:-}
      INSTA360_SDK_DEMO_PATH: ${INSTA360_SDK_DEMO_PATH:-}
      INSTA360_NATIVE_BRIDGE_ENABLED: ${INSTA360_NATIVE_BRIDGE_ENABLED:-false}
    ports:
      - "8010:8010"
    volumes:
      - panorama_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/ready', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:8010}
        VITE_AMAP_WEB_KEY: ${VITE_AMAP_WEB_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  panorama_data:
