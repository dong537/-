name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Start API for smoke test
        shell: bash
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8010 > /tmp/panorama-api.log 2>&1 &
          echo $! > /tmp/panorama-api.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8010/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/panorama-api.log
          exit 1

      - name: Run API smoke test
        shell: pwsh
        working-directory: .
        run: ./scripts/smoke-test.ps1 -Api http://127.0.0.1:8010

      - name: Stop API smoke server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/panorama-api.pid ]; then
            kill "$(cat /tmp/panorama-api.pid)" || true
          fi

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start API for E2E
        shell: bash
        working-directory: api
        run: |
          python -m pip install -r requirements-dev.txt
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8010 > /tmp/panorama-e2e-api.log 2>&1 &
          echo $! > /tmp/panorama-e2e-api.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8010/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/panorama-e2e-api.log
          exit 1

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Stop E2E API
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/panorama-e2e-api.pid ]; then
            kill "$(cat /tmp/panorama-e2e-api.pid)" || true
          fi

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs:
      - api
      - web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose config
        run: docker compose config

      - name: Build API image
        run: docker build -t panorama-companion-api:ci ./api

      - name: Build Web image
        run: docker build --build-arg VITE_API_BASE_URL=http://127.0.0.1:8010 -t panorama-companion-web:ci ./web
